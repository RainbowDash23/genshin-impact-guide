<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genshin Quest Guide · Compendio y Misiones de Mundo de Teyvat</title>
    <meta name="description" content="Guía interactiva premium y registro de expedición de misiones de mundo de Genshin Impact a través de las siete naciones de Teyvat." />
    
    <!-- Tipografía Nunito (original) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      // Aplica el tema antes del primer paint para evitar el
      // parpadeo de fondo blanco/negro al cargar.
      (function () {
        try {
          var mode = localStorage.getItem('gqg:theme');
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
